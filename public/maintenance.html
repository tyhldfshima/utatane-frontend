<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="robots" content="noindex" />
  <title>メンテナンス中 — ウタタネ</title>
  <style>
    :root {
      --bg: #f6f5f0;
      --ink: #1b3a2d;
      --leaf: #2d5a45;
      --sprout: #5da67e;
      --seed: #e8a83e;
      --muted: #6b7b73;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
        "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .mark { margin: 0 auto 28px; display: block; }
    .brand {
      font-size: 15px;
      letter-spacing: 0.08em;
      color: var(--leaf);
      margin: 0 0 6px;
      font-weight: 600;
    }
    .tagline {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 32px;
      letter-spacing: 0.04em;
    }
    h1 {
      font-size: 21px;
      font-weight: 700;
      margin: 0 0 14px;
      letter-spacing: 0.03em;
    }
    p.msg {
      font-size: 14px;
      line-height: 1.9;
      color: var(--muted);
      margin: 0;
    }
    .divider {
      width: 40px;
      height: 2px;
      background: var(--sprout);
      opacity: 0.5;
      border-radius: 2px;
      margin: 28px auto 0;
    }
  </style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 120 120" fill="none" width="96" height="96" aria-hidden="true">
      <ellipse cx="60" cy="98" rx="22" ry="12" fill="#2d5a45" opacity=".7"/>
      <ellipse cx="60" cy="92" rx="6" ry="8" fill="#c47b2b" opacity=".6"/>
      <path d="M60 85 Q60 50 60 24" stroke="#5da67e" stroke-width="3" stroke-linecap="round"/>
      <path d="M60 55 Q45 45 36 50 Q45 60 60 55Z" fill="#5da67e" opacity=".85"/>
      <path d="M60 38 Q75 28 84 34 Q75 44 60 38Z" fill="#5da67e" opacity=".7"/>
      <path d="M60 24 Q55 18 58 12 Q60 16 62 12 Q65 18 60 24Z" fill="#e8a83e" opacity=".8"/>
      <circle cx="24" cy="28" r="3" fill="#e8a83e" opacity=".45"/>
      <circle cx="96" cy="22" r="2.5" fill="#e8a83e" opacity=".35"/>
      <circle cx="102" cy="52" r="3" fill="#5da67e" opacity=".25"/>
      <circle cx="18" cy="64" r="2.5" fill="#5da67e" opacity=".25"/>
    </svg>
    <p class="brand">ウタタネ</p>
    <p class="tagline">一粒の歌が、森になる。</p>
    <h1>ただいまメンテナンス中です</h1>
    <p class="msg">
      よりよい場所をつくるため、<br />
      少しのあいだお休みをいただいています。<br />
      しばらくお待ちください。
    </p>
    <div class="divider"></div>
  </main>
</body>
</html>
